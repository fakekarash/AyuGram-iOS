name: AyuGram iOS smoke IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayugram-smoke-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build a re-signable smoke IPA
    runs-on: macos-26
    timeout-minutes: 330

    steps:
      - name: Check out sources and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select the pinned Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          xcode_path="/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          test -d "$xcode_path"
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version

      - name: Create CI configuration from repository secrets
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          api_id = os.environ.get("TELEGRAM_API_ID", "")
          api_hash = os.environ.get("TELEGRAM_API_HASH", "")
          if not api_id.isdigit():
              sys.exit("TELEGRAM_API_ID must be set to a numeric value")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              sys.exit("TELEGRAM_API_HASH must be set to a 32-character hexadecimal value")

          # The upstream fake profiles are tied to Telegram's bundle/team identifiers.
          # This is only an intermediate, re-signable smoke artifact. It is not a
          # distributable AyuGram release configuration.
          configuration = {
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          with open("build-system/ayugram-ci-configuration.json", "w", encoding="utf-8") as output:
              json.dump(configuration, output, indent=2)
              output.write("\n")
          PY

      - name: Import upstream fake signing certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Build the smoke IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_ayugram \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=build/artifacts

      - name: Validate the IPA archive
        shell: bash
        run: |
          set -euo pipefail
          test -s build/artifacts/Telegram.ipa
          unzip -t build/artifacts/Telegram.ipa >/dev/null
          shasum -a 256 build/artifacts/Telegram.ipa

      - name: Upload the smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-smoke-ipa-${{ github.run_number }}
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7

