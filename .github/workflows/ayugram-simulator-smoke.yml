name: AyuGram iOS simulator smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayugram-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Check macOS, select Xcode and verify pinned Bazel
        run: python3 build-system/ayugram_ci.py preflight

      - name: Initialize exact submodule revisions
        run: |
          set -euo pipefail
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive > "$RUNNER_TEMP/ayugram-submodules.txt"
          if grep -Eq '^[-+U]' "$RUNNER_TEMP/ayugram-submodules.txt"; then
            echo '::error::A submodule is missing, conflicted or at the wrong revision'
            exit 1
          fi

      - name: Apply reviewed sideload compatibility patches
        run: python3 build-system/ayugram_sideload_ci.py patch

      - name: Build simulator client
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 -u build-system/ayugram_simulator_ci.py build

      - name: Install and launch in iOS Simulator
        run: python3 build-system/ayugram_simulator_ci.py launch

      - name: Verify application UI rendered
        run: swift build-system/validate_simulator_screenshot.swift build/ayugram-simulator/results/ayugram-simulator.png

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-simulator-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/ayugram-simulator/results/
          if-no-files-found: error
          retention-days: 7
